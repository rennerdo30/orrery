<!doctype html>
<html><head><meta charset="utf-8"><title>Orrery</title>
<meta name="color-scheme" content="dark">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1e1f24;color:#e8e8e8;font:12px/1.4 Segoe UI,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
.panel{background:rgba(0,0,0,.55);border-radius:6px;padding:8px 10px}
#info{position:fixed;top:8px;left:8px;max-width:360px;white-space:pre-line;pointer-events:none}
#info b{color:#fff}
#note{position:fixed;top:8px;right:8px;max-width:380px;display:none;white-space:pre-wrap}
#note.warn{background:rgba(150,100,0,.9)}
#err{position:fixed;left:8px;right:8px;bottom:64px;background:rgba(160,30,30,.9);color:#fff;display:none;white-space:pre-wrap;max-height:30%;overflow:auto}
#help{position:fixed;bottom:8px;right:8px;color:#9aa;font-size:11px;text-align:right;pointer-events:none}
#hint{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#889;font-size:16px;pointer-events:none}
#ctl{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);display:none;align-items:center;gap:8px;max-width:calc(100% - 200px)}
#ctl button,#ctl select{background:#2a2c33;color:#eee;border:1px solid #555;border-radius:4px;padding:3px 8px;font:inherit}
#ctl button{cursor:pointer}
#ctl button:hover{background:#3a3d46}
#scrub{width:240px}
#clipname{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#clips{max-width:260px}
#loading{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1e1f24;z-index:10}
.loading #loading{display:flex}
#logo{position:relative;width:112px;height:112px}
#logo img{position:absolute;inset:16px;width:80px;height:80px}
#ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,199,95,.18);border-top-color:#ffc75f;box-sizing:border-box;animation:spin 1.1s linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
#lname{font-size:14px;color:#fff;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lstat{color:#9aa}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/examples/jsm/"}}</script>
<script>if (window.__INITIAL) document.documentElement.classList.add('loading');</script>
</head><body>
<div id="hint">Drop a .fbx, .glb or .gltf file here<br>Shift+drop adds its animations to the current model</div>
<div id="info" class="panel" style="display:none"></div>
<div id="note" class="panel"></div>
<div id="err" class="panel"></div>
<div id="ctl" class="panel">
  <button id="play" title="Play / pause (Space)">&#10074;&#10074;</button>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
  <span id="time">0.00 / 0.00 s</span>
  <select id="clips" title="Animation clip"></select>
  <select id="speed" title="Speed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
  <label title="Loop"><input id="loop" type="checkbox" checked> loop</label>
  <label title="Keep the root bone in place"><input id="lock" type="checkbox"> lock root</label>
  <button id="addanim" title="Add animations from another FBX/GLB (or Shift+drop it)">Add animations&hellip;</button>
  <input id="file" type="file" accept=".fbx,.glb,.gltf" hidden>
</div>
<div id="help">R reset &middot; G grid &middot; W wireframe &middot; B background &middot; Space play/pause</div>
<div id="loading"><div id="logo"><div id="ring"></div><img src="/icon.svg" alt=""></div><div id="lname"></div><div id="lstat"></div></div>
<script>
window.addEventListener('DOMContentLoaded', function () { setTimeout(function () { try { window.ipc.postMessage('ready'); } catch (e) {} }, 30); });
function __fail(m) { var e = document.getElementById('err'); e.textContent = 'Orrery could not start: ' + m; e.style.display = 'block'; document.documentElement.classList.remove('loading'); try { window.ipc.postMessage('log:ERROR page ' + m); } catch (x) {} }
window.addEventListener('error', function (ev) { __fail(ev.message || 'script error'); });
window.addEventListener('unhandledrejection', function (ev) { __fail(String(ev.reason && ev.reason.message || ev.reason)); });
</script>
<script type="module" src="/viewer.js" onerror="__fail('could not load viewer.js')"></script>
</body></html>
