name: release

# A version tag builds the Windows package and attaches it to a DRAFT GitHub
# release. Publishing the draft is the owner's yes (docs/RELEASING.md); nothing
# here publishes. A tag with "-" (0.2.0-beta.1) becomes a prerelease.
# The crates.io upload is a separate manual workflow (publish-crate.yml).
# Pattern taken from crabfarm (release.yml there, 2026-11-19).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (vX.Y.Z or vX.Y.Z-pre.N)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # A release is built only from a commit that is on main.
  verify:
    name: tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The tag is resolved to a commit ONCE, here. Every later job checks out
    # this SHA, so a tag moved after this check cannot make a job build or
    # release a commit that was never verified.
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the tag to a commit
        id: resolve
        run: |
          set -euo pipefail
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          case "$sha" in
            [0-9a-f]*) ;;
            *) echo "Could not resolve $RELEASE_TAG to a commit" >&2; exit 1 ;;
          esac
          [ "${#sha}" -ge 40 ] || { echo "Unexpected commit id for $RELEASE_TAG" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Tag commit is an ancestor of origin/main
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            echo "Tag $RELEASE_TAG (${SHA:0:7}) is not on main; refusing to build a release from it." >&2
            exit 1
          fi

  # Orrery is Windows only (WebView2): one x64 package, built natively on a
  # GitHub-hosted runner (windows-latest, checked 2026-11-19 against GitHub's
  # "GitHub-hosted runners" reference; recheck before each release).
  build:
    name: build (x86_64-pc-windows-msvc)
    needs: [verify]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Tag matches the crate version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
      # rust-toolchain.toml pins the toolchain; this installs it.
      - run: rustup show active-toolchain
      - name: Tests
        run: cargo test --release --locked
      # Builds with local paths stripped, refuses a binary that still contains
      # the checkout or profile path, and writes release/orrery-<v>-windows-x64.zip
      # (orrery.exe, LICENSE, THIRD_PARTY_NOTICES, README.md, register.ps1, unregister.ps1).
      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: release/orrery-*-windows-x64.zip
          if-no-files-found: error

  # Signed build provenance for the package (GitHub artifact attestations).
  # The OIDC and attestation permissions live in this job only.
  attest:
    name: build provenance
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/orrery-*

  draft:
    name: draft release (owner publishes)
    needs: [verify, build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create or refresh the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          (cd dist && sha256sum orrery-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          awk -v v="$version" '$0 ~ "^## "v"[[:space:]]*$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md || true
          {
            echo
            echo "**Install (Windows 10 and 11, x64):** unzip \`orrery-$version-windows-x64.zip\` to a folder you keep and optionally run \`register.ps1\` to add Orrery to *Open with*; or build it with \`cargo install --locked orrery-viewer\` (installs \`orrery.exe\`). The exe is not code-signed, so SmartScreen may warn on the first run. Guide: https://orrery.renner.dev"
            echo "Check the download against SHA256SUMS.txt, or verify its provenance with \`gh attestation verify <zip> --repo $GH_REPO\`."
          } >> notes.md
          flags=(--draft --verify-tag --title "Orrery $version" --notes-file notes.md)
          case "$RELEASE_TAG" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Never touch a published release; refresh only a draft.
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release $RELEASE_TAG is already published; nothing changed." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* "${flags[@]}"
          fi
          echo "Draft ready: the owner publishes it on GitHub."
