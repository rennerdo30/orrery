# cargo-deny configuration. CI runs `cargo deny check licenses advisories
# sources` (job "cargo-deny" in .github/workflows/ci.yml). `bans` is not checked.
#
# Orrery is built for Windows only, so only that target's dependency graph counts.
[graph]
targets = ["x86_64-pc-windows-msvc"]

# licenses: every dependency is permissively licensed (THIRD_PARTY_NOTICES lists
# them all). For "A OR B" expressions one allowed side is enough.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
]

# RustSec advisories: a known vulnerability fails the check. Yanked crates are
# reported (a yanked version in Cargo.lock needs a `cargo update -p`, not a red
# CI on an unrelated change).
[advisories]
version = 2
yanked = "warn"

# Dependencies come from crates.io only: no other registry, no git sources.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
