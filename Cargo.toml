[package]
name = "orrery"
version = "0.1.0"
edition = "2021"
description = "Orrery - a fast, tiny 3D model viewer for FBX, glTF and GLB"
license = "MIT"
build = "build.rs"

[dependencies]
wry = "0.57"
tao = "0.37"
base64 = "0.22"
serde_json = "1"
percent-encoding = "2"
ico = "0.4"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
